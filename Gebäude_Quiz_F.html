<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gebäude-Quiz F</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <a class="link" href="index.html">
            <img src="img/logo.svg" alt="" width="300px">
        </a>
        <ul id="nav">
            <li><a href="Übersicht.html">Übersicht</a></li>
            <li><a href="https://webseiten.htw-berlin.de/files/Presse/Lageplaene/Lageplan_WH_DE.pdf"
                    target="_blank">Lageplan</a></li>
            <li><a href="https://lsf.htw-berlin.de" target="_blank">LSF</a></li>
            <li><a href="https://moodle.htw-berlin.de" target="_blank">Moodle</a></li>
            <li><a href="https://www.htw-berlin.de" target="_blank">HTW Berlin</a></li>
        </ul>
    </header>

    <main>
        <h1>Und wohin jetzt</h1>
        <p>
            Welches Gebäude liegt zwischen den Gebäuden H, G und E?
        </p>

        <p>
           <h2> Tipp</h2> <!-- clue -->
        </p>
        <form id="quiz-form">
            <fieldset>
                <legend>Wähle eine Antwortmöglichkeit aus:</legend>

                <label>
                    <input type="radio" name="mc-answer" value="A">
                    Gebäude F
                </label><br>

                <label>
                    <input type="radio" name="mc-answer" value="B">
                    Gebäude C
                </label><br>

                <label>
                    <input type="radio" name="mc-answer" value="C">
                    Gebäude G
                </label><br>
            </fieldset>
            <button type="button" onclick="checkAnswer()">Antwort prüfen</button>
    
            <p id="feedback" aria-live="polite"></p>

            <!-- Button, der erst bei korrketer Eingabe erscheint -->
            <button type="button" id="next-button" onclick="goToNext()" style="display: none;">
                <a href="Aufgabe_1_Gebäude_F.html">Zu "Aufgabe 1 Gebäude F" gehen</a>
            </button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 HTW Berlin Campustour</p>
    </footer>


        <script>
        function checkAnswer() {
            const correctMC = "A";                // richtige Multiple-Choice-Antwort
            const nextButton = document.getElementById("next-button"); // Button zur nächsten Station
            const mcSelection = document.querySelector('input[name="mc-answer"]:checked'); // ausgewählte Antwort
            const feedback = document.getElementById("feedback"); // Feedback-Element

            let mcCorrect = false;

            if (mcSelection && mcSelection.value === correctMC) {
                mcCorrect = true;
            }

            if (mcCorrect) {
                feedback.textContent = "Super! Richtige Antwort, du kannst nun zum Gebäude gehen.";
                feedback.style.color = "green";
                nextButton.style.display = "block"; // Zeige den Button an
            } 
            else {
                feedback.textContent = "Das war leider noch nicht richtig. Überlege dir die Antwort noch einmal und versuche es erneut.";
                feedback.style.color = "red";
                nextButton.style.display = "none"; // Verstecke den Button, wenn die Antwort falsch ist
            }
        }
        </script>

</body>

</html>
